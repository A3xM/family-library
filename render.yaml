services:
  - type: web
    name: family-library
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
      - key: SPRINT_DB_ID
        sync: false
      - key: AUTHORS_DB_ID
        sync: false
      - key: GENRES_DB_ID
        sync: false
